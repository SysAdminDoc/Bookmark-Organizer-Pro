[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-organizer-pro"
version = "6.16.0"
description = "Professional bookmark manager with AI categorization, semantic search, MCP server, and HTML snapshots"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.34.2",
    "idna>=3.15.0",
    "Pillow>=12.3.0",
    "defusedxml>=0.7",
    "tksheet>=7.6,<8",
    "urllib3>=2.7.0",
    "lxml>=6.1.3",
    "lz4>=4.4.5,<5",
    "regex>=2026.8.31",
    "ijson>=3.5.1,<4",
]

[project.optional-dependencies]
ai = [
    "trafilatura>=2.2",
    # lingua 2.2 raised its floor to Python 3.12, but the verified release lock
    # is built on Python 3.11 (packaging/release_manifest.json). Without this
    # marker a lock regenerated on 3.11 either fails or silently pins an older
    # version while the manifest still claims the range.
    "lingua-language-detector>=2.0,<2.2; python_version < '3.12'",
    "lingua-language-detector>=2.0; python_version >= '3.12'",
    "fastembed>=0.4,<1.0",
    "lancedb>=0.37,<0.38",
]
encryption = ["cryptography>=50.0.0"]
mcp = ["mcp>=1.29.1,<2.0", "fastmcp>=3.4.1,<4.0"]
nuitka = ["Nuitka>=4.1,<5.0"]
sunvalley = ["sv-ttk>=2.6.1,<3.0"]
themedetect = ["darkdetect>=0.8"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "playwright>=1.50",
    "pip-audit>=2.10.1",
    "pyinstaller>=6.20",
    "jaraco.text>=4.0",
]
all = [
    "bookmark-organizer-pro[ai,encryption,mcp,sunvalley,themedetect]",
]

[project.scripts]
bop = "bootstrap_dependencies:run_cli"
bop-mcp = "bootstrap_dependencies:run_mcp_server"

[tool.setuptools]
py-modules = ["bootstrap_dependencies"]

[tool.setuptools.packages.find]
include = ["bookmark_organizer_pro*"]

[tool.setuptools.package-data]
# Ship bundled data assets (e.g. the default category patterns) with the wheel,
# plus any compiled message catalogs so a translation can load from an install.
bookmark_organizer_pro = ["**/*.json", "locale/*/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
# Large existing GUI codebase — lint for real correctness problems, not style.
extend-exclude = ["build", "dist", "packaging"]

[tool.ruff.lint]
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Forward-reference type hints under `from __future__ import annotations`
# (organization.py) and a dynamically-injected global (mcp_server.py) are not
# runtime-undefined; ruff can't see that, so exempt those files from F821.
"bookmark_organizer_pro/services/organization.py" = ["F821"]
"bookmark_organizer_pro/mcp_server.py" = ["F821"]
"tests/*" = ["F841", "B011"]
