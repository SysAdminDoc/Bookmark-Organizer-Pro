<!doctype html>
<html lang="en" dir="ltr" data-i18n-title="popupTitle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save to Bookmark Organizer Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup-body">
  <main class="panel">
    <header class="product-header">
      <div class="brand-row">
        <span class="brand-mark">B</span>
        <div class="brand-copy">
          <p class="product-name" data-i18n="extensionName">Bookmark Organizer Pro</p>
          <p class="eyebrow" data-i18n="localFirstCapture">Local-first capture</p>
        </div>
        <span class="privacy-mark" aria-label="Saved locally" data-i18n-aria-label="savedLocally" title="Saved locally" data-i18n-title="savedLocally">&#10003;</span>
      </div>
    </header>

    <section class="surface-heading">
      <p class="section-kicker" data-i18n="currentPage">Current page</p>
      <h1 data-i18n="saveBookmark">Save Bookmark</h1>
      <p id="pageTitle" class="page-summary" data-i18n="loadingActiveTab">Loading active tab...</p>
    </section>

    <section class="workspace-card form-card">
      <label>
        <span class="field-label-row">
          <span data-i18n="category">Category</span>
          <span id="categoryDefault" class="category-default" data-i18n="categoryDefaultValue">Default: Uncategorized / Needs Review</span>
        </span>
        <input id="category" type="text" autocomplete="off" list="categoryList" aria-describedby="categoryHint" data-i18n-placeholder="categoryBlankPlaceholder" placeholder="Use the default category">
        <datalist id="categoryList"></datalist>
        <span id="categoryHint" class="field-hint category-hint" data-i18n="categoryBlankHint">Leave blank to use the named default category. A blank category is never saved.</span>
      </label>

      <label>
        <span data-i18n="tags">Tags</span>
        <input id="tags" type="text" placeholder="design, research, reading" data-i18n-placeholder="tagsPlaceholder" autocomplete="off">
      </label>

      <label>
        <span data-i18n="notes">Notes</span>
        <textarea id="notes" maxlength="5000" placeholder="Add context you will want when rediscovering this page." data-i18n-placeholder="notesPlaceholder"></textarea>
      </label>

      <div class="choice-group">
        <label class="checkbox-row">
          <input id="readLater" type="checkbox">
          <span data-i18n="readLater">Read Later</span>
        </label>

        <label class="checkbox-row">
          <input id="captureSnapshot" type="checkbox">
          <span data-i18n="preserveSignedInPage">Preserve this signed-in page</span>
        </label>
        <p class="field-hint" data-i18n="captureHint">Embeds sanitized same-site styles, images, and fonts (up to 4.5 MB). Scripts and forms are removed; cookies are never sent.</p>
      </div>
    </section>

    <div class="actions">
      <button id="saveBookmark" type="button" data-i18n="saveBookmark">Save Bookmark</button>
      <button id="openOptions" class="secondary" type="button" data-i18n="options">Options</button>
    </div>

    <section id="pendingPanel" class="pending-panel" role="status" aria-live="polite" hidden>
      <p id="pendingCount" data-i18n="zeroPendingSaves">0 pending quick saves</p>
      <ul id="pendingList" class="pending-list" aria-label="Pending save details" data-i18n-aria-label="pendingSaveDetails"></ul>
      <div class="pending-actions">
        <button id="retryPending" type="button" data-i18n="retry">Retry</button>
        <button id="exportPending" class="secondary" type="button" data-i18n="exportJson">Export JSON</button>
        <button id="clearPending" class="secondary" type="button" data-i18n="clear">Clear</button>
        <button id="restorePending" class="secondary" type="button" hidden data-i18n="undoClear">Undo Clear</button>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <script src="i18n.js"></script>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
