<!doctype html>
<html lang="en" dir="ltr" data-i18n-title="optionsTitle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmark Organizer Pro Options</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="options-body">
  <main class="panel">
    <header class="product-header">
      <div class="brand-row">
        <span class="brand-mark">B</span>
        <div class="brand-copy">
          <p class="product-name" data-i18n="extensionName">Bookmark Organizer Pro</p>
          <p class="eyebrow" data-i18n="extensionSettings">Extension settings</p>
        </div>
      </div>
    </header>

    <section class="options-heading">
      <p class="section-kicker" data-i18n="connection">Connection</p>
      <h1 data-i18n="localApi">Local API</h1>
      <p data-i18n="connectDescription">Connect the extension to the local Bookmark Organizer Pro API.</p>
    </section>

    <section class="workspace-card settings-card">
      <div class="setting-copy">
        <h2 data-i18n="localConnection">Local connection</h2>
        <p data-i18n="credentialPrivacy">Credentials stay in the extension vault and connect only to this device.</p>
      </div>
      <div class="settings-grid">
        <label>
          <span data-i18n="apiPort">API port</span>
          <input id="apiPort" type="number" min="1" max="65535" value="8765" inputmode="numeric">
        </label>

        <label>
          <span data-i18n="apiToken">API token</span>
          <input id="apiToken" type="password" autocomplete="off" spellcheck="false">
        </label>
      </div>

      <label>
        <span class="field-label-row">
          <span data-i18n="defaultCategory">Default category</span>
          <span id="defaultCategoryValue" class="category-default" data-i18n="categoryDefaultValue">Default: Uncategorized / Needs Review</span>
        </span>
        <input id="defaultCategory" type="text" value="Uncategorized / Needs Review" aria-describedby="defaultCategoryHint">
        <span id="defaultCategoryHint" class="field-hint category-hint" data-i18n="defaultCategoryHint">This named category is used whenever a capture leaves Category blank.</span>
      </label>
    </section>

    <div class="actions">
      <button id="saveOptions" type="button" data-i18n="saveSettings">Save Settings</button>
      <button id="testConnection" class="secondary" type="button" data-i18n="testApi">Test API</button>
      <button id="replacePairing" class="secondary" type="button" data-i18n="replacePairing">Replace Pairing</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <script src="i18n.js"></script>
  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
